[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-rings"
version = "1.0.0"
description = "Graph-based fraud ring detection combining Louvain community heuristics and HistGradientBoosting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.2",
    "pandas>=2.0,<3",
    "networkx>=3.2,<4",
    "scikit-learn>=1.4,<1.6",
    "matplotlib>=3.7,<4",
    "joblib>=1.3,<2",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.28,<1",
    "pydantic>=2.6,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "E501"]
