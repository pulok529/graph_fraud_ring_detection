name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint and check formatting with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run test suite with pytest
        run: |
          pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fraud-rings:latest .

      - name: Run Docker container
        run: |
          docker run -d --name fraud-api -p 8000:8000 fraud-rings:latest

      - name: Verify healthcheck endpoint with retries
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:8000/health; then
              echo "Service is healthy!"
              exit 0
            fi
            echo "Waiting for service to become healthy ($i/30)..."
            sleep 2
          done
          echo "Healthcheck timed out"
          docker logs fraud-api
          exit 1

      - name: Cleanup container
        if: always()
        run: docker rm -f fraud-api
